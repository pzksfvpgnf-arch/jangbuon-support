<style>

<body><main>

(function(){
const policy={
ko:{
 title:'또판 개인정보처리방침',effective:'최종 갱신: 2026-11-01 · 공개 버전과 내부 테스트 버전의 기능은 다를 수 있습니다.',
 contact:'운영: AXENFOLD · 개인정보 및 서비스 문의: axenfold.support@gmail.com',
 sections:[
 ['1. 계정과 Apple Game Center','또판은 별도의 개발자 회원가입이나 로그인을 요구하지 않습니다. 이용자가 선택적으로 Apple Game Center에 로그인하면 표시 이름, 플레이어 식별자와 순위표 점수를 Apple 서비스와 주고받을 수 있습니다. 이 정보는 AXENFOLD 자체 서버에 저장하지 않습니다.'],
 ['2. 기기 내부 기록','게임 기록, 코인, 가구, 방 배치, 캐릭터, 업적 및 설정 등은 기기에 저장합니다. 과거 방문·방명록 기록은 앱 업데이트로 자동 삭제하지 않지만 새 화면에 표시하거나 동기화하지 않습니다.'],
 ['3. 내 방 사진 공유','사용자가 직접 선택한 경우에만 자신의 방, 직접 지정한 방 이름과 업적을 이미지로 생성하여 저장하거나 공유합니다. 친구 방 방문, 친구 코드, 방명록은 제공하지 않고 이를 위한 서버에도 데이터를 전송하지 않습니다. 외부 앱으로 공유하면 해당 서비스의 정책이 적용됩니다.'],
 ["광고·추적과 선택 (iOS)", "광고가 포함된 버전은 Google AdMob을 이용합니다. 광고 제공·효과 측정·분석을 위해 Google은 IP 주소에서 추정한 대략적 지역, 기기 식별자, 광고 및 앱 상호작용, 성능·오류 진단 정보를 처리할 수 있습니다. iOS 1.5.1 빌드 118부터는 광고 제거 미구매가 확인되면 Apple의 추적 권한을 먼저 확인합니다. 허용한 경우에만, 해당 지역의 동의 절차를 거쳐 외부 광고를 요청합니다. Google은 광고 효과 측정을 위해 기기 광고 식별자를 다른 회사 앱·웹사이트의 활동과 연결할 수 있습니다. 거절·제한 시 Google 광고·동의창을 호출하지 않으며, 게임과 방 꾸미기를 계속 이용할 수 있고 선택 보너스는 기기 내 게임 소개로도 받을 수 있습니다. 권한은 iOS 설정 → 개인정보 보호 및 보안 → 추적에서 변경할 수 있습니다. 이 동작은 이전 빌드나 Android에 소급되지 않습니다."],
 ['5. Apple 인앱결제',"광고 제거가 제공되는 iOS 버전에서는 Apple이 결제·복원을 처리하고 StoreKit이 구매 자격을 확인합니다. 개발자는 결제 카드 정보를 받지 않습니다."],
 ['6. 저장·삭제 및 백업','코인·가구·방 배치 등 로컬 정보는 앱 또는 앱 데이터 삭제 시 사라질 수 있습니다. 이전 빌드의 방문·방명록 기록은 새 화면에서 사용하지 않으나 업데이트만으로 자동 삭제하지 않습니다. 기기 백업·복원은 운영체제 정책을 따릅니다.'],
 ['7. 변경과 고지','앱 업데이트에서 실제로 활성화되는 기능에 맞춰 개인정보 공개 항목과 본 방침을 검토합니다. 새 기능을 추가하거나 외부 처리 방식이 달라지면 시행 전에 필요한 안내를 갱신합니다.']
]},
en:{
 title:'TTOPAN Privacy Policy',effective:'Updated November 1, 2026 · Public and internal test builds may have different features.',
 contact:'Operator: AXENFOLD · Privacy and support: axenfold.support@gmail.com',
 sections:[
 ['1. Accounts and Apple Game Center','TTOPAN does not require a developer-operated account or sign-in. If you choose to sign in to Apple Game Center, the app may exchange your Game Center player identifier, display name, and leaderboard scores with Apple. AXENFOLD does not host these identifiers on a developer server.'],
 ['2. Information on your device','Game records, coins, furniture, room layouts, avatars, badges, and settings are stored locally. Older room visit and guestbook records are not automatically erased by an app update, but are no longer displayed or synchronized.'],
 ['3. Sharing your own room photo','Only when you choose to save or share an image does the app render your room, chosen room name, and badges into a photo. Friend visits, friend codes, and guestbooks are no longer available. These photos are not sent to a developer-operated room server. External sharing apps have their own privacy policies.'],
 ["Advertising, tracking and your choice (iOS)", "Ad-supported versions use Google AdMob. Google may process IP-derived approximate location, device identifiers, ad and product interactions, and performance and crash diagnostics for advertising, measurement and analytics. Starting with iOS 1.5.1 build 118, after verifying that Remove Ads is not owned, the app checks Apple’s system tracking permission first. Third-party ads are requested only with authorization and after applicable regional consent. Google may link the device advertising identifier to activity in other companies’ apps and websites for ad measurement. With denial or restriction, the app does not call Google ads or its consent form. Games and decorating remain available, and a local game spotlight can provide the optional bonus. Change permission in iOS Settings → Privacy & Security → Tracking. This behavior is specific to the indicated build and does not describe Android or older versions."],
 ['5. Apple in-app purchases',"In iOS versions offering Remove Ads, Apple handles billing and restoration. StoreKit verifies entitlement. The developer does not receive payment card details."],
 ['6. Storage, deletion, and backup','Local coins, furniture, layouts and settings may be lost when you uninstall or erase app data. Historical room visits and stamps are not shown in the new interface but are not automatically erased by the update. Operating-system backup rules apply.'],
 ['7. Policy changes','We review this policy and App Store privacy disclosures before activating new functionality or changing external data processing.']
]},
ja:{
 title:'TTOPAN プライバシーポリシー',effective:'更新日：2026年11月1日 · 公開版と内部テスト版では機能が異なる場合があります。',
 contact:'運営：AXENFOLD · お問い合わせ：axenfold.support@gmail.com',
 sections:[
 ['1. アカウントとGame Center','独自アカウントやログインは必須ではありません。Apple Game Centerへの任意のログイン時には、プレイヤー識別子・表示名・ランキングスコアがAppleサービスとやり取りされる場合があります。開発者サーバーには保存しません。'],
 ['2. 端末内の記録','スコア、コイン、家具、部屋の配置、キャラクター、実績、各種設定は端末に保存されます。旧版の訪問記録と足あとは更新で自動削除されませんが、新画面では表示・同期しません。'],
 ['3. 自分の部屋の写真共有','利用者が選択した場合のみ、自分の部屋、入力した名前、実績を写真として保存または共有します。友だちの部屋訪問、友だちコード、足あと帳は提供せず、関連サーバーにも送信しません。外部共有先のプライバシー方針が適用されます。'],
 ["広告・トラッキングと選択（iOS）", "広告対応版ではGoogle AdMobを使います。Googleは広告・効果測定・分析のため、IPによる概算位置、端末識別子、広告・アプリ操作、性能・障害データを処理する場合があります。iOS 1.5.1 ビルド118以降は広告削除を未購入と確認した後、先にAppleのトラッキング許可を確認します。許可され、地域別の同意手続きが済んだ場合に限り外部広告を要求します。Googleは広告識別子と他社アプリ・サイトでの行動を結び付けて広告効果を測定する場合があります。拒否・制限時はGoogleの広告・同意画面を呼び出さず、ゲーム・部屋づくりや端末内のゲーム紹介による任意のボーナスも利用できます。権限はiOS設定→プライバシーとセキュリティ→トラッキングで変更できます。旧ビルドやAndroidには遡及しません。"],
 ['5. Appleアプリ内課金',"対応するiOS版ではAppleが決済・復元を処理します。StoreKitで広告削除の有効性を確認し、開発者はカード情報を受け取りません。"],
 ['6. 保存・削除・バックアップ','端末のコイン、家具、部屋の配置などはアプリやデータの削除で失われることがあります。旧版の訪問・足あと記録は新画面には表示されませんが、更新のみで自動削除されません。OSのバックアップ規則が適用されます。'],
 ['7. 変更','新機能や外部処理を有効にする前に、アプリのプライバシー申告と本ポリシーを更新します。']
]},
zh:{
 title:'TTOPAN 隐私政策',effective:'更新日期：2026年11月1日 · 正式版与内部测试版的功能可能不同。',
 contact:'运营方：AXENFOLD · 隐私及服务联系：axenfold.support@gmail.com',
 sections:[
 ['1. 账户与Apple Game Center','无需注册开发者账号。用户可自愿登录Apple Game Center，此时可能与Apple服务交换玩家标识、显示名称和排行榜成绩。AXENFOLD不会在自己的服务器上存储这些标识。'],
 ['2. 设备本地数据','分数、金币、家具、房间布置、角色、成就及设置保存在本机。旧版的好友访问和留言记录不会因更新自动删除，但新界面不再显示或同步。'],
 ['3. 分享自己的房间照片','仅在用户主动选择时，应用才会将自己的房间、输入的房间名称和成就生成图片供保存或分享。不再提供好友访问、好友代码或留言簿功能，也不会向相关开发者服务器发送数据。第三方分享应用适用各自的隐私政策。'],
 ["广告、跟踪与您的选择（iOS）", "含广告版本使用Google AdMob。为投放广告、衡量效果及分析，Google可能处理由IP推断的大致位置、设备标识符、广告与应用互动，以及性能和崩溃诊断信息。自iOS 1.5.1构建118起，确认未购买去广告后，应用会先检查Apple系统跟踪权限。仅在您允许并完成适用地区的同意流程后才请求第三方广告。Google可将设备广告标识符与其他公司应用和网站上的活动关联以衡量广告效果。拒绝或受限时，应用不会调用Google广告或其同意表单；游戏和房间装饰不受影响，设备内的游戏介绍仍可获得可选奖励。可在iOS设置→隐私与安全性→跟踪中更改权限。此行为不追溯适用于旧版本或Android。"],
 ['5. Apple应用内购买',"在提供去广告功能的iOS版本中，Apple处理付款与恢复购买，StoreKit验证购买资格；开发者不接收银行卡信息。"],
 ['6. 存储、删除和备份','卸载应用或清除数据可能使本机金币、家具和房间布置记录丢失。旧版访客和留言记录不在新界面显示，但更新不会自动删除。设备备份与恢复遵循操作系统规则。'],
 ['7. 政策更新','在启用新的数据处理功能之前，将更新本政策及App Store隐私披露信息。']
]}
};
const KEY='ttopan.privacy.lang';
const supported=['ko','en','ja','zh'];
const params=new URLSearchParams(location.search);
let locale=params.get('lang');
if(!supported.includes(locale)){try{locale=localStorage.getItem(KEY)}catch{}}
if(!supported.includes(locale)){const primary=(navigator.language||'en').toLowerCase().split(/[-_]/)[0];locale=supported.includes(primary)?primary:'en'}
function render(lang){
 locale=lang;
 document.documentElement.lang=lang==='zh'?'zh-Hans':lang;
 const c=policy[lang];document.title=c.title;
 document.querySelector('#heading').textContent=c.title;
 document.querySelector('#effective').textContent=c.effective;
 document.querySelector('#contact').textContent=c.contact;
 const holder=document.querySelector('#sections');holder.replaceChildren();
 for(const pair of c.sections){
  const section=document.createElement('section');
  const h=document.createElement('h2');h.textContent=pair[0];section.append(h);
  const p=document.createElement('p');p.textContent=pair[1];section.append(p);
  holder.append(section)
 }
 document.querySelectorAll('button[data-lang]').forEach(btn=>btn.setAttribute('aria-pressed',String(btn.dataset.lang===lang)));
 try{localStorage.setItem(KEY,lang)}catch{}
}
document.querySelectorAll('button[data-lang]').forEach(btn=>btn.addEventListener('click',()=>render(btn.dataset.lang)));
render(locale);
})();
</script></body></html>
